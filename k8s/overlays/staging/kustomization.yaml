apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: self-healing-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Service
      name: self-healing-app
    patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30052
