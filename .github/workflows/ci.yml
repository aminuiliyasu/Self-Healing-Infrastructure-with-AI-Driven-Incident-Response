name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run engine unit tests
        working-directory: engine
        run: |
          pip install -r requirements.txt
          python -m unittest -v

  docker-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t self-healing-app:ci ./app

      - name: Smoke test endpoints
        run: |
          set -euo pipefail
          docker run -d --name app-ci -p 5050:5000 self-healing-app:ci
          sleep 4
          curl -fsS http://127.0.0.1:5050/health | grep -q OK
          curl -fsS http://127.0.0.1:5050/metrics | grep -q '^# HELP'
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5050/error | grep -q 500
          docker rm -f app-ci

  kustomize-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build overlays
        run: |
          kubectl kustomize k8s/overlays/dev > /dev/null
          kubectl kustomize k8s/overlays/staging > /dev/null

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
