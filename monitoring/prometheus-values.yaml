# Values for the prometheus-community/prometheus Helm chart.
# Applied by terraform/main.tf (helm_release) or manually with:
#   helm install monitoring prometheus-community/prometheus \
#     -n monitoring --create-namespace -f monitoring/prometheus-values.yaml

server:
  service:
    type: NodePort
    nodePort: 30090
  # Short retention is fine for a demo cluster.
  retention: "2d"

# Keep the footprint small on Minikube.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

# Scrape the demo app in both environments.
extraScrapeConfigs: |
  - job_name: self-healing-app-dev
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - self-healing-app.dev.svc.cluster.local:5000
  - job_name: self-healing-app-staging
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - self-healing-app.staging.svc.cluster.local:5000
